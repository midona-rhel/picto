[package]
name = "picto_node"
version = "0.6.8-alpha"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"
serde_json = "1.0"
picto_core = { path = "../../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }

[build-dependencies]
napi-build = "2.1"
cc = "1"

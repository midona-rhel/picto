[package]
name = "picto_core"
version = "0.6.8-alpha"
edition = "2021"
license = "MIT"

[dependencies]
picto_library = { path = "../picto-library" }
picto_sources = { path = "../picto-sources" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Image processing
image = "0.25"
jpeg-decoder = { version = "0.3", default-features = false }
jxl-oxide = { version = "0.12.6", features = ["image"] }
fast_image_resize = { version = "5", features = ["image"] }
webp = "0.3"
kmeans_colors = { version = "0.7", default-features = false, features = ["palette_color"] }
palette = { version = "0.7", default-features = false, features = ["std"] }
lcms2 = { version = "6.1", features = ["static"] }

# SVG rendering
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

# Video/audio processing — uses bundled ffmpeg/ffprobe CLI binaries (see scripts/download-ffmpeg.sh)

# Archive handling
zip = "2"

# XML parsing (EPUB, OOXML, Krita, etc.)
roxmltree = "0.20"

# HTTP client (for subscriptions + model downloads)
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "http2", "json", "rustls-tls", "stream", "system-proxy"] }
futures-util = "0.3"
url = "2"

# ONNX Runtime for AI tagger inference (GPU backends loaded dynamically)
ort = { version = "2.0.0-rc.12", features = ["ndarray", "download-binaries", "copy-dylibs"] }
ndarray = "0.17"

# OS keychain credential storage (macOS Keychain, Windows Credential Manager, Linux Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Hashing & checksums
sha2 = "0.10"
img_hash = "3.2"
rustdct = "0.4"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.0"
tempfile = "3.8"
base64 = "0.22"
rand = "0.8"
open = "5"

# SQLite database engine (WAL mode, FTS5)
rusqlite = { version = "0.40.0", features = ["backup", "bundled", "functions", "session"] }
fallible-streaming-iterator = "0.1"

# Roaring bitmaps for fast set operations
roaring = "0.10"

# LRU cache for hash↔file_id mapping
lru = "0.12"

# High-performance locking (no-syscall uncontended, RwLock for concurrent reads)
parking_lot = "0.12"

# TypeScript type generation from Rust structs (PBI-234)
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreml-native = "0.2"
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["directml"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["webgpu"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

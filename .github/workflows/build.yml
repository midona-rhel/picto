name: Build & Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create a GitHub Release for (e.g. v0.2.0-alpha). Leave empty to skip release.'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            artifact: macos-arm64
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x64
          - os: windows-latest
            platform: win
            artifact: windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            native/picto-node -> target

      # ── macOS dependencies ──────────────────────────────────────────
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install lcms2 pkg-config

      # ── Linux dependencies ──────────────────────────────────────────
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            liblcms2-dev \
            libssl-dev \
            libclang-dev \
            libfuse2

      # ── Windows dependencies ────────────────────────────────────────
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # ── Download bundled sidecar binaries (all platforms) ───────────
      - name: Download FFmpeg binaries
        run: bash scripts/download-ffmpeg.sh

      - name: Download gallery-dl
        run: bash scripts/download-gallery-dl.sh

      # ── Build ───────────────────────────────────────────────────────
      - name: Install root dependencies
        run: npm install

      - name: Install NAPI CLI
        working-directory: native/picto-node
        run: npm install

      - name: Build native module
        working-directory: native/picto-node
        run: npx napi build --release

      - name: Copy ONNX Runtime shared libraries alongside native module
        shell: bash
        run: |
          # copy-dylibs puts ONNX Runtime libs in the Rust target dir
          # Copy them next to index.node so electron-builder bundles them
          cp native/picto-node/target/release/onnxruntime.dll native/picto-node/ 2>/dev/null || true
          cp native/picto-node/target/release/libonnxruntime.dylib native/picto-node/ 2>/dev/null || true
          cp native/picto-node/target/release/libonnxruntime.so* native/picto-node/ 2>/dev/null || true
          ls -la native/picto-node/*.dll native/picto-node/*.dylib native/picto-node/*.so* 2>/dev/null || echo "No shared libs found (may be statically linked)"

      - name: Build frontend
        run: npm run build:electron

      # ── Package ─────────────────────────────────────────────────────
      - name: Package with electron-builder
        run: npx electron-builder --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload artifacts ────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picto-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: warn

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Picto ${{ inputs.release_tag }}
          body_path: RELEASE_NOTES_v0.2.0-alpha.md
          draft: false
          prerelease: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

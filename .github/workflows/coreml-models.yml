name: Core ML Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ai/coreml-export-requirements.txt

      - name: Install converter
        run: python -m pip install -r scripts/ai/coreml-export-requirements.txt

      - name: Export fixed-shape Core ML programs
        run: >-
          python scripts/ai/export-coreml-models.py
          oppai-oracle-v1-1
          --output artifacts/coreml
          --artifact-version v2

      - name: Verify registered checksums
        run: >-
          python scripts/ai/verify-coreml-manifest.py artifacts/coreml
          --slug oppai-oracle-v1-1

      - name: Extract candidate package
        run: >-
          unzip -q
          artifacts/coreml/oppai-oracle-v1-1-coreml-macos15-v2.zip
          -d artifacts/oppai-oracle-v1-1

      - name: Verify ONNX parity
        run: >-
          python scripts/ai/verify-coreml-parity.py
          oppai-oracle-v1-1
          artifacts/oppai-oracle-v1-1/model.mlpackage
          resources/tutorial

      - name: Verify warm performance
        run: >-
          python scripts/ai/benchmark-coreml.py
          oppai-oracle-v1-1
          artifacts/oppai-oracle-v1-1/model.mlpackage
          resources/tutorial/mona-lisa.jpg
          --max-median-ms 500

      - name: Publish immutable model assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ai-models-v2
          name: Picto AI Models v2
          body_path: scripts/ai/README.md
          prerelease: false
          overwrite_files: false
          files: artifacts/coreml/*.zip

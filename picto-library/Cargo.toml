[package]
name = "picto_library"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Test harnesses can reset derived query caches without reopening SQLite.
# This entry point is absent from production builds.
benchmark-internals = []

[[example]]
name = "browse_acceptance_probe"
required-features = ["benchmark-internals"]

[dependencies]
arc-swap = "1.7"
memchr = "2.7"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rayon = "1.11"
roaring = { version = "0.10", features = ["serde"] }
rusqlite = { version = "0.40.0", features = ["backup", "bundled", "functions", "hooks"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"

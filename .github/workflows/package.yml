name: Package

# Builds the packages of Picto (`app/package.sh`) on the three
# systems and proves on each that the packaged program starts. This is the
# only workflow that builds packages.
#
# The Alpha Gate (`alpha-gate.yml`) calls this workflow for every push to a
# release branch. The packages that such a run uploads are the ones a release
# publishes: the artifacts `picto-macos-arm64`, `picto-linux-x64` and
# `picto-windows-x64`.
#
# Each job makes a release build, which takes a long time. Outside a release
# the workflow therefore starts by itself only for a pull request that
# changes the packaging itself. For any other change, start it by hand from
# the Actions page.
on:
  workflow_call:
    inputs:
      # With `true`, the macOS job fails when the signing certificate is
      # missing. The Alpha Gate passes `true`, so that a release never holds
      # an unsigned app.
      require-mac-signing:
        type: boolean
        default: false
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
  pull_request:
    branches:
      - dev
    paths:
      - "app/package.sh"
      - "app/packaging/**"
      - "app/build.rs"
      - "app/Cargo.toml"
      - "scripts/mac-signing.mjs"
      - "scripts/sign-mac-app.mjs"
      - "scripts/generate-app-icons.mjs"
      - "scripts/release-audit.mjs"
      - ".github/workflows/package.yml"
  workflow_dispatch:

# A new push to the same branch stops the run of the push before it. The
# group holds the name of the workflow that started the run, which is "Alpha
# Gate" when the Alpha Gate calls this workflow. A run started by hand
# therefore never stops the packaging of a release on the same branch.
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: package (${{ matrix.platform }})
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            artifact: macos-arm64
            package-artifacts: |
              app/target/package/*.dmg
              app/target/package/*.zip
              app/target/package/latest-mac.yml
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x64
            package-artifacts: |
              app/target/package/*.AppImage
              app/target/package/latest-linux.yml
          - os: windows-latest
            platform: windows
            artifact: windows-x64
            package-artifacts: |
              app/target/package/*.exe
              app/target/package/latest.yml

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On macOS, Node.js runs the script that signs the app and the script
      # that draws the layer of the app's icon (`scripts/generate-app-icons.mjs`,
      # which needs the package `@resvg/resvg-js`).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'macOS'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (macOS)
        if: runner.os == 'macOS'
        run: npm ci --ignore-scripts

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: app -> target
          cache-on-failure: true

      # The libraries that the app and the application core are built
      # against (the list in `app/README.md`, section 3).
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # appimagetool makes the AppImage, and the runtime is the small program
      # at the start of every AppImage that unpacks and starts it. Both are
      # downloaded at one fixed release each and must have the SHA-256 that
      # GitHub lists for that release's file.
      - name: Download appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o "$tools/runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check <<SUMS
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tools/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $tools/runtime
          SUMS
          chmod 755 "$tools/appimagetool"
          echo "APPIMAGETOOL=$tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$tools/runtime" >> "$GITHUB_ENV"

      # The installer is compiled with NSIS. The Windows runner image does
      # not have it, so it is installed here from Chocolatey at one fixed
      # version; the Chocolatey package checks the download against a
      # checksum of its own. Then the installer's script is compiled once
      # with an empty file in place of the program, so that a mistake in the
      # script is found now and not after the release build.
      - name: Install NSIS and compile the installer's script (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          if [[ ! -x "$makensis" ]]; then
            echo "::error::makensis was not found after NSIS was installed."
            exit 1
          fi
          echo "makensis: $makensis"
          MSYS_NO_PATHCONV=1 "$makensis" -VERSION
          echo
          stand_in="$RUNNER_TEMP/installer-stand-in"
          mkdir -p "$stand_in/files/resources"
          : > "$stand_in/files/Picto.exe"
          cp build/picto-pack.ico "$stand_in/files/resources/"
          printf 'Delete "$INSTDIR\\Picto.exe"\n' > "$stand_in/uninstall-files.nsh"
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$makensis" -V2 -INPUTCHARSET UTF8 \
            -DVERSION=0.0.0 -DVERSION_NUMBERS=0.0.0.0 -DESTIMATED_SIZE_KB=1 \
            "-DSOURCE=$(cygpath -w "$stand_in/files")" \
            "-DOUTPUT=$(cygpath -w "$stand_in/setup.exe")" \
            "-DICON=$(cygpath -w "$PWD/build/icon.ico")" \
            "-DUNINSTALL_LIST=$(cygpath -w "$stand_in/uninstall-files.nsh")" \
            "$(cygpath -w "$PWD/app/packaging/windows/installer.nsi")"

      - name: Download FFmpeg binaries
        shell: bash
        run: bash scripts/download-ffmpeg.sh

      # With the certificate, the macOS app is signed and the package must
      # also hold the compiled Icon Composer icon. A release requires both
      # (`require-mac-signing`), and the script then fails without the
      # certificate. In any other run without the certificate, for example
      # for a pull request from a fork, which gets no secrets, the app is not
      # signed and the script says so.
      - name: Package
        shell: bash
        working-directory: app
        env:
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && inputs.require-mac-signing && 'true' || 'false' }}
        run: |
          if [[ "$REQUIRE_MAC_SIGNING" == true || -n "$MAC_CSC_LINK" ]]; then
            export PICTO_REQUIRE_MAC_SIGNING=true
          fi
          ./package.sh
          echo "PICTO_SIGNED=$([[ -n "$MAC_CSC_LINK" ]] && echo true || echo false)" >> "$GITHUB_ENV"

      # The package must consist of exactly the files that a release
      # publishes for this system, under their release names, and the update
      # feed must name them.
      - name: Audit the package
        shell: bash
        run: node scripts/release-audit.mjs --artifacts

      # The archive is unpacked into a new folder, and the program in it is
      # run with `--version`. It must print the app's name and version and
      # the folder beside itself as the place it takes `ffmpeg` from, and the
      # `ffmpeg` there must run. The same is done from the mounted disk
      # image. A signed app must still pass the signature check after it was
      # unpacked.
      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        working-directory: app/target/package
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          check="$RUNNER_TEMP/unpacked"
          mkdir -p "$check"
          ditto -x -k "Picto-$version-arm64-mac.zip" "$check"
          find "$check/Picto.app" -type f | sort
          plutil -lint "$check/Picto.app/Contents/Info.plist"
          output="$("$check/Picto.app/Contents/MacOS/Picto" --version)"
          echo "$output"
          expected="$(printf 'Picto %s\nffmpeg: %s (beside the program)' "$version" "$check/Picto.app/Contents/MacOS")"
          test "$output" = "$expected"
          "$check/Picto.app/Contents/MacOS/ffmpeg" -version | head -n 1
          "$check/Picto.app/Contents/MacOS/ffprobe" -version | head -n 1
          codesign --display --verbose=2 "$check/Picto.app" 2>&1 || true
          if [[ "$PICTO_SIGNED" == true ]]; then
            codesign --verify --deep --strict "$check/Picto.app"
            test -s "$check/Picto.app/Contents/Resources/Assets.car"
          fi
          volume="$RUNNER_TEMP/volume"
          hdiutil attach -nobrowse -readonly -mountpoint "$volume" "Picto-$version-arm64.dmg"
          ls -la "$volume"
          test "$(readlink "$volume/Applications")" = /Applications
          output="$("$volume/Picto.app/Contents/MacOS/Picto" --version)"
          test "$(printf '%s\n' "$output" | head -n 1)" = "Picto $version"
          hdiutil detach "$volume"

      # The AppImage is copied into a new folder and unpacked there, and the
      # program in it is run with `--version`, as on macOS. That the program
      # starts also proves that it finds its shared libraries beside itself.
      # Then the AppImage is run as a user runs it, in a container that holds
      # only an Ubuntu 24.04 with the libraries the user guide names, and no
      # development packages.
      - name: Check the package (Linux)
        if: runner.os == 'Linux'
        working-directory: app/target/package
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          check="$RUNNER_TEMP/unpacked"
          mkdir -p "$check"
          cp "Picto-$version.AppImage" "$check/"
          cd "$check"
          "./Picto-$version.AppImage" --appimage-extract > /dev/null
          find squashfs-root | sort
          ldd squashfs-root/usr/bin/picto
          output="$(squashfs-root/AppRun --version)"
          echo "$output"
          expected="$(printf 'Picto %s\nffmpeg: %s (beside the program)' "$version" "$check/squashfs-root/usr/bin")"
          test "$output" = "$expected"
          squashfs-root/usr/bin/ffmpeg -version | head -n 1
          squashfs-root/usr/bin/ffprobe -version | head -n 1
          # An update that waits when the app quits runs the new AppImage
          # once with this variable; it must end at once without starting.
          APPIMAGE_EXIT_AFTER_INSTALL=true squashfs-root/AppRun
          docker run --rm -v "$check:/check:ro" ubuntu:24.04 bash -c "
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libwebkit2gtk-4.1-0 libgtk-3-0t64 libasound2t64 libfontconfig1 \
              libxkbcommon-x11-0 libwayland-client0 libvulkan1 > /dev/null
            /check/Picto-$version.AppImage --appimage-extract-and-run --version
          " | tee "$RUNNER_TEMP/container.txt"
          test "$(head -n 1 "$RUNNER_TEMP/container.txt")" = "Picto $version"

      # The update feed is read by the app's own reader
      # (`src/updates/feed.rs`), which must find in it this version and, for
      # the AppImage, the SHA-512 and the size the file really has. The three
      # feeds are written by one function of `package.sh`, so this is done on
      # one system only; it needs a debug build of the tests.
      - name: Check the update feed (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          cat target/package/latest-linux.yml
          PICTO_GPUI_TEST_FEED="$PWD/target/package/latest-linux.yml" \
            cargo test --locked -- --ignored --exact \
            updates::tests::a_feed_written_by_the_package_script_describes_its_packages

      # The installer is run as a user's first installation, silently: the
      # program must be in the folder electron-builder's installer uses, the
      # registry must hold the values that installer writes, the shortcuts
      # must exist and carry the app's id, `.picto-pack` files must be
      # registered, and the installed program must start. Then the installer
      # is run again with the arguments the updater passes, as an upgrade,
      # and at last the uninstaller must remove all of it.
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Resolve-Path "app/target/package/Picto-Setup-$version.exe"
          Get-Content app/target/package/latest.yml
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\Picto'
          $guid = '7dbe711a-2259-5c88-af70-ded36653dd46'
          $installKey = "HKCU:\Software\$guid"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid"
          $startLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Picto.lnk'
          $desktopLink = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Picto.lnk'
          function Expect($condition, $what) {
            if (-not $condition) { throw "FAILED: $what" }
            "ok: $what"
          }
          function Install($arguments) {
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            Expect ($process.ExitCode -eq 0) "the installer ended with code 0 for: $arguments"
          }
          function ShortcutAppId($link) {
            $shell = New-Object -ComObject Shell.Application
            $item = $shell.Namespace((Split-Path $link)).ParseName((Split-Path $link -Leaf))
            $item.ExtendedProperty('System.AppUserModel.ID')
          }
          function CheckInstalled {
            Expect (Test-Path "$folder\Picto.exe") "Picto.exe is in $folder"
            Expect (Test-Path "$folder\ffmpeg.exe") 'ffmpeg.exe is beside it'
            Expect (Test-Path "$folder\ffprobe.exe") 'ffprobe.exe is beside it'
            Get-ChildItem $folder -Recurse | ForEach-Object { $_.FullName }
            Expect ((Get-ItemProperty $installKey).InstallLocation -eq $folder) 'InstallLocation names the folder'
            $entry = Get-ItemProperty $uninstallKey
            Expect ($entry.DisplayName -eq "Picto $version") 'the uninstall entry is named after the version'
            Expect ($entry.UninstallString -eq "`"$folder\Uninstall Picto.exe`" /currentuser") 'the uninstall entry names the uninstaller'
            Expect (Test-Path $startLink) 'the Start menu shortcut exists'
            Expect (Test-Path $desktopLink) 'the desktop shortcut exists'
            Expect ((ShortcutAppId $startLink) -eq 'com.picto.desktop') 'the Start menu shortcut carries the app id'
            Expect ((ShortcutAppId $desktopLink) -eq 'com.picto.desktop') 'the desktop shortcut carries the app id'
            Expect ((Get-ItemProperty 'HKCU:\Software\Classes\.picto-pack').'(default)' -eq 'Picto Pack') '.picto-pack is registered'
            Expect ((Get-ItemProperty 'HKCU:\Software\Classes\Picto Pack\shell\open\command').'(default)' -eq "`"$folder\Picto.exe`" `"%1`"") 'a pack opens with the installed program'
            $output = (& "$folder\Picto.exe" --version | Out-String).Trim() -replace "`r", ''
            $output
            Expect ($output -eq "Picto $version`nffmpeg: $folder (beside the program)") 'the installed program prints its version and its ffmpeg folder'
            & "$folder\ffmpeg.exe" -version | Select-Object -First 1
          }
          Expect (-not (Test-Path $folder)) 'Picto is not installed on the runner before the check'
          Install '/S'
          CheckInstalled
          Install '--updated /S'
          CheckInstalled
          Start-Process -FilePath "$folder\Uninstall Picto.exe" -ArgumentList '/currentuser /S' -Wait
          # The uninstaller copies itself to a temporary folder and goes on
          # from there, so the program started above ends before the work is
          # done.
          for ($second = 0; $second -lt 60 -and (Test-Path $folder); $second++) { Start-Sleep 1 }
          Expect (-not (Test-Path $folder)) 'the uninstaller removed the folder'
          Expect (-not (Test-Path $installKey)) 'the uninstaller removed the installation key'
          Expect (-not (Test-Path $uninstallKey)) 'the uninstaller removed the uninstall entry'
          Expect (-not (Test-Path $startLink)) 'the uninstaller removed the Start menu shortcut'
          Expect (-not (Test-Path $desktopLink)) 'the uninstaller removed the desktop shortcut'
          Expect (-not (Test-Path 'HKCU:\Software\Classes\Picto Pack')) 'the uninstaller removed the pack file class'

      # Picto up to version 0.6.19-alpha was built with Electron and
      # installed by an installer that electron-builder made. This installer
      # must upgrade such an installation in place. The installer of the
      # release named here is downloaded and run silently, then this
      # installer is run with the arguments the updater of that version
      # passes. Afterwards the same folder must hold this app and none of
      # the old version's files, and the registry values and the shortcuts
      # must still be there.
      - name: Check the upgrade of an Electron-based Picto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RELEASE: v0.6.19-alpha
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Resolve-Path "app/target/package/Picto-Setup-$version.exe"
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\Picto'
          $guid = '7dbe711a-2259-5c88-af70-ded36653dd46'
          $installKey = "HKCU:\Software\$guid"
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid"
          $startLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Picto.lnk'
          function Expect($condition, $what) {
            if (-not $condition) { throw "FAILED: $what" }
            "ok: $what"
          }
          $old = Join-Path $env:RUNNER_TEMP 'electron'
          gh release download $env:OLD_RELEASE --repo $env:GITHUB_REPOSITORY --pattern 'Picto-Setup-*.exe' --dir $old
          $oldInstaller = (Get-ChildItem $old -Filter 'Picto-Setup-*.exe')[0].FullName
          # On the runner the old version's installer sometimes ends with the
          # code -1073741819 (an access violation inside that installer) and
          # installs nothing. It is then run again, three times at most. Its
          # exit code is printed and not checked: what matters here is that
          # the old version is installed, which the next lines check.
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path "$folder\resources\app.asar"); $attempt++) {
            $process = Start-Process -FilePath $oldInstaller -ArgumentList '/S' -Wait -PassThru
            "attempt ${attempt}: the old version's installer ended with code $($process.ExitCode)"
          }
          Expect (Test-Path "$folder\resources\app.asar") "the old version is installed in $folder"
          Expect ((Get-ItemProperty $installKey).InstallLocation -eq $folder) "the old version's installer wrote InstallLocation"
          "the old version's uninstall entry: $((Get-ItemProperty $uninstallKey).UninstallString)"
          Expect (Test-Path $startLink) "the old version's installer made the Start menu shortcut"
          $process = Start-Process -FilePath $installer -ArgumentList '--updated /S' -Wait -PassThru
          Expect ($process.ExitCode -eq 0) 'this installer ended with code 0 as an upgrade'
          Get-ChildItem $folder -Recurse | ForEach-Object { $_.FullName }
          Expect (-not (Test-Path "$folder\resources\app.asar")) "the old version's files are gone"
          Expect (-not (Test-Path "$folder\resources.pak")) "the Electron runtime's files are gone"
          Expect ((Get-ItemProperty $installKey).InstallLocation -eq $folder) 'InstallLocation still names the folder'
          Expect ((Get-ItemProperty $uninstallKey).DisplayName -eq "Picto $version") 'the uninstall entry names the new version'
          Expect (Test-Path $startLink) 'the Start menu shortcut is still there'
          $output = (& "$folder\Picto.exe" --version | Out-String).Trim() -replace "`r", ''
          $output
          Expect ($output -eq "Picto $version`nffmpeg: $folder (beside the program)") 'the program in the folder is this app'
          Start-Process -FilePath "$folder\Uninstall Picto.exe" -ArgumentList '/currentuser /S' -Wait
          for ($second = 0; $second -lt 60 -and (Test-Path $folder); $second++) { Start-Sleep 1 }
          Expect (-not (Test-Path $folder)) 'the uninstaller removed the folder'

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picto-${{ matrix.artifact }}
          path: ${{ matrix.package-artifacts }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

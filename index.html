<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data: blob:; media-src 'self' media:; font-src 'self'; connect-src 'self' ws://127.0.0.1:* media:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>Picto</title>
    <script>
      // Blocking: set theme attributes + background before CSS loads to prevent flash
      (function() {
        var THEME_BG = {
          dark: 'rgb(24,25,27)', blue: '#0f1732', purple: '#1e1526',
          gray: '#323236', light: '#ebedef', lightgray: '#c8cacd',
          vibrancy: 'transparent', liquidglass: 'transparent',
          mica: 'transparent', acrylic: 'transparent'
        };
        var LIGHT_THEMES = { light: 1, lightgray: 1 };
        var theme = localStorage.getItem('picto-theme') || 'dark';
        var resolved = theme;
        if (theme === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var scheme = LIGHT_THEMES[resolved] ? 'light' : 'dark';
        var el = document.documentElement;
        el.dataset.mantineColorScheme = scheme;
        el.dataset.theme = theme === 'auto' ? '' : theme;
        el.style.colorScheme = scheme;
        el.style.backgroundColor = THEME_BG[resolved] || THEME_BG.dark;
      })();
    </script>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entrypoints/main.tsx"></script>
  </body>
</html>

[package]
name = "picto-gpui-spike"
version = "0.1.0"
edition = "2024"
publish = false

# This crate is a Cargo workspace of its own, so that its dependencies and its
# lock file stay out of the repository's root workspace. The patched GPUI
# crates under `vendor/` are dependencies of this workspace, not members.
[workspace]
exclude = ["vendor"]

# The root workspace's profiles do not apply here. A debug build optimizes
# this crate a little (level 1), because drawing and decoding are too slow to
# use without any optimization, and keeps debug assertions and overflow
# checks.
[profile.dev]
opt-level = 1
# The checks need only the line numbers in backtraces. With full debug
# information and incremental compilation, every build of this crate, the
# vendored GPUI and the application core writes several gigabytes that
# nothing deletes.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2

# The profile of the packaged app (`package.sh` builds with `--release`).
[profile.release]
# Full optimization of every crate. This is Cargo's default for a release
# build and is written here so that the profile can be read in one place.
opt-level = 3
# Debug assertions stay off. `src/seams.rs` reads the environment variables
# that drive, observe or redirect the app only under `debug_assertions`, the
# keychain is used only without them (`logins::uses_keychain`), and the
# checks in `net_check.rs` and `logins/check.rs` are compiled only with
# them. Turning this on would put all of that into the packaged app.
debug-assertions = false
# Thin link-time optimization inlines across crates (the application core,
# GPUI and this crate) at a fraction of the build time of full link-time
# optimization, which a continuous-integration job cannot afford on about
# 1,100 packages.
lto = "thin"
# The packaged program carries neither symbol names nor debug information,
# which makes it several times smaller.
strip = "symbols"
# A panic unwinds, which is Cargo's default. A panic on a background thread
# then ends that thread only: the app keeps running and shows the panic in
# its log window (`diagnostics::crash`). With `abort`, any panic would end
# the whole app at once.
panic = "unwind"

# The AVFoundation frame check needs the process's main thread, which the
# standard test harness does not give a test.
[[test]]
name = "avfoundation_frames"
harness = false

[dependencies]
# Resolves a path as `canonicalize` does and returns its ordinary form on
# Windows (`src/paths.rs`). The lock file already held this crate, because
# other dependencies use it.
dunce = "1.0.5"
# `gpui-pre` and `gpui-pre-platform` are weekly snapshots of upstream GPUI
# (zed-industries/zed) on crates.io. The official `gpui` crate has not been
# published since 0.2.2 (October 2025). The version is pinned exactly,
# because GPUI does not promise a stable API from one snapshot to the next.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
picto_library = { path = "../picto-library" }
# `picto_core` is the application core. It holds the commands, the workers
# and the events.
picto_core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# `picto_library` gives some reads the library's own SQLite connection, and
# this crate opens a library's database itself in `application/copy.rs` and
# `libraries/admission.rs`. The version is the one `picto_library` builds,
# so that SQLite is not compiled a second time.
rusqlite = "0.40"
unicode-segmentation = "1"
# `icu_segmenter` finds word boundaries as a browser finds them, with the
# dictionaries for Chinese, Japanese and Thai. The version and the features
# are the ones GPUI already builds.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
anyhow = "1"
# GPUI and its renderers write their warnings through `log`. The app takes
# them from there and shows them in the log window.
log = "0.4"
serde_json = "1"
futures = "0.3"
same-file = "1"
tempfile = "3"
image = "0.25"
# `jpeg-decoder` decodes a JPEG at an eighth, a quarter or half of its size,
# for an original that is shown smaller than it is. The `image` crate decodes
# JPEG with zune-jpeg, which cannot decode at a reduced size.
jpeg-decoder = { version = "0.3", default-features = false }
smallvec = "1"
url = "2"
chrono = "0.4"
# `sys-locale` reads the system's language, which sets the interface's
# default language and how numbers and dates are written. The version is the
# one wgpu's dependencies already build.
sys-locale = "0.3"
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f", features = ["audio", "mp3", "aac", "lzma"] }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f", default-features = false, features = ["cpal"] }
ruffle_common = { git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f" }
wgpu = "27.0.1"
# The document viewers use the next three crates. All three are written in
# Rust only, so they build on every system. `hayro` draws PDF pages.
# `djvu-rs` draws DjVu pages. `jxl-oxide` decodes JPEG XL; the application
# core makes thumbnails with the same decoder.
hayro = "0.9"
djvu-rs = "0.45"
jxl-oxide = { version = "0.12.6", features = ["image"] }
# `resvg` draws SVG pages inside comic archives. The version is the one GPUI
# already builds.
resvg = { version = "0.46", default-features = false }
# CBZ and EPUB are zip archives; EPUB's manifest and chapters are XML.
zip = { version = "8", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
pulldown-cmark = { version = "0.13", default-features = false }
# `cosmic-text` lays out and draws text without a window, for the thumbnails
# of text documents. The version is the one GPUI's wgpu renderer already
# builds.
cosmic-text = "0.19"
# `ttf-parser` reads a font's family name, which is needed to load the font
# into GPUI's text system.
ttf-parser = "0.25"
# The tables of a WOFF font are zlib streams, and `flate2` unpacks them. The
# version is the one `zip` already builds.
flate2 = "1"
# The media viewer plays audio with these crates. `cpal` is the audio output
# that Ruffle already uses. `symphonia` decodes the audio formats a library
# holds and is written in Rust only.
cpal = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm", "adpcm", "flac", "ogg", "vorbis", "isomp4", "aac", "aiff"] }
rustfft = "6"
# `lyon_tessellation` gives the lines of the audio visualizer round ends and
# round joins. GPUI uses the same crate.
lyon_tessellation = "1"
# The site logins (`src/logins/`) use these crates for OAuth 1 signatures,
# OAuth 2 states and the token requests. The versions and the features are
# the ones the application core already builds.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# `sha2` computes the SHA-256 that names a site icon in the cache and the
# SHA-512 that a downloaded update is checked against. The version is the
# one the application core already builds.
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "http2", "json", "rustls-tls", "stream", "system-proxy"] }
# `wry` gives the sign-in window its web view: WKWebView on macOS, WebView2
# on Windows and WebKitGTK on Linux (`src/platform/login_window/`). The
# version is pinned exactly, because the app also calls the platform crates
# that `wry` is built on directly, to reach the cookie stores.
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"] }

# `build.rs` calls the Windows resource compiler through this crate, to put
# the app's icon and its version information into the program. GPUI's build
# script already uses the same crate to embed the program's manifest, so the
# lock file gains no new package.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The format matrix draws the viewers off-screen through GPUI's headless
# renderer, which only test builds include.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "runtime_shaders", "wayland", "x11", "test-support"] }

# `gpui_apple` holds the macOS text system. The off-screen checks use it
# because it can be made on a thread other than the main thread, which the
# macOS platform cannot.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.12" }
# `gpui_macos` holds the code of the macOS platform that reads dropped
# files. A test runs that code on a pasteboard made for the test.
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.12" }

# On Windows and Linux the off-screen checks draw with GPUI's wgpu renderer
# and its portable text system. Windows uses them too because GPUI's DirectX
# platform has no headless renderer.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12", features = ["test-support"] }

# `zbus` sends the D-Bus signal that sets the launcher badge on Linux. The
# version is the one that the notification service GPUI uses already builds.
# `gpui_linux` is a direct dependency because the list of files that Copy
# puts on the clipboard is built by the vendored X11 drag source, and because
# the tests check how the platform reads dropped files.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.12" }

# On Linux the sign-in window is a GTK window that holds a WebKitGTK web
# view, and the app reads the cookies through WebKitGTK's cookie manager.
# The versions are the ones `wry` builds.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# `webview2-com` reaches the cookies of the sign-in window on Windows
# (`ICoreWebView2CookieManager`). `windows` and `windows-core` give the Win32
# calls that the app makes itself: the clipboard, window placement, the
# instance pipe and the process list. The versions of these three are the
# ones `wry` builds. `gpui_windows` is a direct dependency because the list
# of files that Copy puts on the clipboard is built by the vendored drag
# source, and because the tests check how the platform reads dropped files.
[target.'cfg(windows)'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.12" }
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

# `libc` reads the user's id, which names the single-instance folder
# (`opening/instance/unix.rs`). The version is the one the other
# dependencies already build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# The app plays video through AVFoundation, and GPUI's `surface` element
# shows each frame, which is a CoreVideo pixel buffer. The `objc2` crates
# that follow give the calls for that. Their versions are the ones GPUI
# builds.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSURL", "NSValue", "NSObject", "NSArray", "NSError", "NSGeometry", "NSData", "NSHTTPCookie", "NSDate"] }
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelBufferIOSurface"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange"] }
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVMediaFormat", "AVTime", "AVVideoSettings", "AVVideoComposition", "block2", "objc2-core-media", "objc2-core-video"] }
block2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["CABase"] }
# `objc2-web-kit` reaches the cookies of the sign-in window
# (`WKHTTPCookieStore`) and reports a page that fails to load
# (`WKNavigationDelegate`). The version is the one `wry` builds.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "WKNavigation", "WKNavigationDelegate"] }

# The GPUI crates under `vendor/` take the place of the published ones. They
# are the published 0.3.12 sources with this app's changes, one of which is
# the backdrop blur that the glass panels use. Only the crates that have
# changes are vendored, and `vendor/README.md` lists every change.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

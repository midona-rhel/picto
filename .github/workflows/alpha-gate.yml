name: Alpha Gate

on:
  pull_request:
    branches:
      - "release/**"
  push:
    branches:
      - "release/**"
    tags:
      - "v*alpha*"
      - "v*rc*"
  workflow_dispatch:

concurrency:
  group: alpha-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  alpha-verify:
    name: alpha:verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            core -> target
            native/picto-node -> target

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libclang-dev \
            libfuse2 \
            xvfb

      - name: Download FFmpeg binaries
        run: bash scripts/download-ffmpeg.sh

      - name: Install root dependencies
        run: npm ci

      - name: Install NAPI CLI deps
        working-directory: native/picto-node
        run: npm ci

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path core/Cargo.toml --locked

      - name: Run alpha verify gate
        run: npm run gate:alpha

  alpha-package:
    name: alpha:package + alpha:smoke (${{ matrix.platform }})
    needs: alpha-verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            artifact: macos-arm64
            package-artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/*.yml
              dist/*.blockmap
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x64
            package-artifacts: |
              dist/*.AppImage
              dist/*.yml
              dist/*.blockmap
          - os: windows-latest
            platform: windows
            artifact: windows-x64
            package-artifacts: |
              dist/*.exe
              dist/*.yml
              dist/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            core -> target
            native/picto-node -> target

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libclang-dev \
            libfuse2 \
            xvfb

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Download FFmpeg binaries
        run: bash scripts/download-ffmpeg.sh

      - name: Install root dependencies
        run: npm ci

      - name: Install NAPI CLI deps
        working-directory: native/picto-node
        run: npm ci

      - name: Package alpha artifacts
        run: npm run alpha:package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          PICTO_REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && 'true' || 'false' }}

      - name: Run alpha smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run alpha:smoke -- --platform "${{ matrix.platform }}" --report "artifacts/alpha-smoke/${{ matrix.platform }}.json"

      - name: Run alpha smoke
        if: runner.os != 'Linux'
        run: npm run alpha:smoke -- --platform "${{ matrix.platform }}" --report "artifacts/alpha-smoke/${{ matrix.platform }}.json"

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: picto-${{ matrix.artifact }}
          path: ${{ matrix.package-artifacts }}
          if-no-files-found: error

      - name: Upload alpha smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-smoke-${{ matrix.platform }}
          path: artifacts/alpha-smoke/${{ matrix.platform }}.json
          if-no-files-found: error

  alpha-release-assets:
    name: Attach Release Assets
    needs: alpha-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: picto-*
          merge-multiple: true

      - name: Select versioned release notes
        shell: bash
        run: |
          notes="docs/${GITHUB_REF_NAME#v}-release-notes.md"
          test -f "$notes"
          cp "$notes" release-notes.md

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.AppImage
            release-artifacts/*.exe
            release-artifacts/*.yml
            release-artifacts/*.blockmap

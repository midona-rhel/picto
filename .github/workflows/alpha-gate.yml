name: Alpha Gate

on:
  pull_request:
    branches:
      - "release/**"
  push:
    branches:
      - "release/**"
    tags:
      - "v*alpha*"
      - "v*rc*"
  workflow_dispatch:

concurrency:
  group: alpha-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  verify-renderer:
    name: verify:renderer
    # Release branches are the gate. A tag points at that already-gated commit;
    # rerunning the entire test suite before the three platform builds only
    # duplicated the slowest work.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check localization
        run: npm run check:localization

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test renderer
        run: npm run test -- --run

      - name: Check command parity
        run: npm run check:command-parity

  verify-rust:
    name: verify:rust
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # release-audit is a Node script, but this job does not install the
      # renderer dependency tree.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      # The workspace crates dominate clean CI builds. The target cache keeps
      # Cargo's local dependency graph; sccache reuses unchanged compilation
      # units when a source change prevents an exact target-cache hit.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libclang-dev

      - name: Download FFmpeg test binaries
        run: bash scripts/download-ffmpeg.sh

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path core/Cargo.toml --locked

      - name: Audit release inputs
        run: node scripts/release-audit.mjs

      # Keep strict lint ahead of the long Rust test suite. A new compiler lint
      # should fail one named step immediately, not surface after every test has run.
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --lib --tests --locked --quiet

  alpha-package:
    name: alpha:package + alpha:smoke (${{ matrix.platform }})
    needs:
      - verify-renderer
      - verify-rust
    # Release branches are preflight-only. Packaging them as well as their tag
    # doubled every platform build and encouraged tagging before CI was green.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && (startsWith(github.ref, 'refs/tags/') || (needs.verify-renderer.result == 'success' && needs.verify-rust.result == 'success')) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            artifact: macos-arm64
            package-artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/*.blockmap
          - os: ubuntu-24.04
            platform: linux
            artifact: linux-x64
            package-artifacts: |
              dist/*.AppImage
              dist/latest-linux.yml
              dist/*.blockmap
          - os: windows-latest
            platform: windows
            artifact: windows-x64
            package-artifacts: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/picto-node/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libclang-dev \
            libfuse2 \
            xvfb

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Download FFmpeg binaries
        run: bash scripts/download-ffmpeg.sh

      - name: Install root dependencies
        run: npm ci

      - name: Install NAPI CLI deps
        working-directory: native/picto-node
        run: npm ci

      - name: Package alpha artifacts
        run: npm run alpha:package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          PICTO_REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && 'true' || 'false' }}

      - name: Run alpha smoke (Linux)
        id: smoke-linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run alpha:smoke -- --platform "${{ matrix.platform }}" --report "artifacts/alpha-smoke/${{ matrix.platform }}.json"

      - name: Run alpha smoke
        id: smoke-other
        if: runner.os != 'Linux'
        run: npm run alpha:smoke -- --platform "${{ matrix.platform }}" --report "artifacts/alpha-smoke/${{ matrix.platform }}.json"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picto-${{ matrix.artifact }}
          path: ${{ matrix.package-artifacts }}
          if-no-files-found: error

      - name: Upload alpha smoke report
        if: always() && (steps.smoke-linux.outcome != 'skipped' || steps.smoke-other.outcome != 'skipped')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-smoke-${{ matrix.platform }}
          path: artifacts/alpha-smoke/${{ matrix.platform }}.json
          if-no-files-found: error

  alpha-release-assets:
    name: Attach Release Assets
    needs: alpha-package
    # A tag intentionally skips alpha-verify. `always()` prevents that skipped
    # ancestor from suppressing publication after every package job succeeds.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.alpha-package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: picto-*
          merge-multiple: true

      - name: Select versioned release notes
        shell: bash
        run: |
          notes="docs/${GITHUB_REF_NAME#v}-release-notes.md"
          test -f "$notes"
          cp "$notes" release-notes.md

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.AppImage
            release-artifacts/*.exe
            release-artifacts/*.yml
            release-artifacts/*.blockmap

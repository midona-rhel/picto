name: Alpha Gate

# The gate that a release passes.
#
# - A pull request into a release branch is verified.
# - A push to a release branch is verified, and the packages for the three
#   systems are built and checked.
# - A tag publishes the packages that the push of the same commit built. A
#   tag builds nothing.
on:
  pull_request:
    branches:
      - "release/**"
  push:
    branches:
      - "release/**"
    tags:
      - "v*alpha*"
      - "v*rc*"
  workflow_dispatch:

concurrency:
  group: alpha-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/verify.yml

  # The packages are built beside the verification, not after it, so that
  # the gate takes no longer than its slowest job. Publication needs the
  # whole run to succeed. A pull request builds no packages and gets no
  # signing secrets.
  package:
    name: package
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/package.yml
    with:
      require-mac-signing: true
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

  alpha-release-assets:
    name: Attach Release Assets
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Finds the run of this workflow that the push of this commit to its
      # release branch started, and requires that it succeeded and still
      # holds the three packages.
      - name: Require the exact successful release gate
        id: gate
        run: node scripts/ci/find-release-gate.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          run-id: ${{ steps.gate.outputs.run-id }}
          artifact-ids: ${{ steps.gate.outputs.artifact-ids }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          digest-mismatch: error

      - name: Select versioned release notes
        shell: bash
        run: |
          notes="docs/${GITHUB_REF_NAME#v}-release-notes.md"
          test -f "$notes"
          cp "$notes" release-notes.md

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.AppImage
            release-artifacts/*.exe
            release-artifacts/*.yml

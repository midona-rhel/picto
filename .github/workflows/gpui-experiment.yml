name: GPUI experiment

# Builds and tests experiments/gpui on the platforms it is not developed on,
# and photographs it there. macOS is built locally on every change; this
# proves the same source compiles and its tests pass on Windows and Linux,
# and uploads pictures of the app drawn off-screen on each (the `pictures-*`
# artifacts), the only way to see it on those systems from a Mac.
on:
  push:
    branches:
      - "feature/163-**"
    paths:
      - "experiments/gpui/**"
      - "picto-library/**"
      - "core/**"
      - ".github/workflows/gpui-experiment.yml"
  workflow_dispatch:

concurrency:
  group: gpui-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build + test (${{ matrix.platform }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            experiments/gpui -> target
            . -> target
          cache-on-failure: true

      # GPUI's Linux backends (Wayland, X11, Vulkan, fontconfig; lavapipe,
      # the software Vulkan driver the pictures are drawn with), the audio
      # output Ruffle links against, and what the application core needs
      # (D-Bus for the keyring, libclang for its bindings).
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            mesa-vulkan-drivers \
            xvfb \
            xauth \
            dbus

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # A drop of a file the drag offers to save (XDS, what browsers and
      # archive managers drag on X11), received by the platform's own code
      # from a source the test makes on a virtual X display. (Windows' drop
      # of virtual files is checked by the tests above; it needs no display.)
      - name: Drop check (Linux)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1024x768x24"
          cargo test --locked -- --ignored --exact
          imports::drop::tests::an_x11_drop_of_a_file_offered_to_save_arrives_whole

      # A synthetic library of generated pictures (the application core's
      # example), marked disposable and kept where the app's guard allows a
      # copy: a `picto-gpui-…` folder directly in the system's temporary
      # folder. Then the off-screen tool plays `ci/smoke.txt` into it with
      # GPUI's wgpu renderer on the software adapter (lavapipe on Linux,
      # WARP through Direct3D 12 on Windows).
      - name: Pictures
        shell: bash
        run: |
          native() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          unix() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -u "$1"; else printf '%s' "$1"; fi; }
          if [[ "$RUNNER_OS" == Windows ]]; then temp="$(unix "$TEMP")"; else temp=/tmp; fi
          scratch="$(mktemp -d "$temp/picto-gpui-synthetic.XXXXXX")"
          library="$scratch/Synthetic.library"
          (cd ../.. && PICTO_DEMO_ITEMS=2000 cargo run --locked -p picto_core --example million_grid_demo -- "$(native "$library")")
          printf 'synthetic:million_grid_demo\n' > "$library/.gpui-disposable"
          # The pictures are taken in a copy the app itself makes, as a user
          # on this system would make one.
          # Through cargo, which puts the libraries the core's ONNX Runtime
          # links (libwebgpu_dawn.so on Linux) on the loader's path.
          copy="$(cargo run --locked -q -- --make-copy "$(native "$library")" | tail -n 1)"
          echo "copy: $copy"
          echo "PICTO_CI_COPY=$copy" >> "$GITHUB_ENV"
          out="$(unix "$RUNNER_TEMP")/pictures"
          mkdir -p "$out"
          PICTO_GPUI_SILENT=1 PICTO_GPUI_MENU=window \
          PICTO_GPUI_COPY="$copy" \
          PICTO_GPUI_SCRIPT="$(native "$PWD/ci/smoke.txt")" \
          PICTO_GPUI_OUT="$(native "$out")" \
            cargo test --locked -- --ignored --exact offscreen::plays_a_script --nocapture

      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pictures-${{ matrix.platform }}
          path: ${{ runner.temp }}/pictures
          if-no-files-found: warn

      # Cloud sync end to end in the off-screen tool (`ci/cloud.txt`): a
      # library made in a test folder syncs to a folder standing in for a
      # Dropbox desktop folder, takes a snapshot, and is restored from it in
      # Settings › Cloud, which closes the library, replaces its database and
      # opens it again (on Windows this fails if the app still holds a
      # connection to the database). No provider or account is contacted.
      - name: Cloud
        shell: bash
        run: |
          native() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          unix() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -u "$1"; else printf '%s' "$1"; fi; }
          if [[ "$RUNNER_OS" == Windows ]]; then temp="$(unix "$TEMP")"; else temp=/tmp; fi
          scratch="$(mktemp -d "$temp/picto-gpui-cloud.XXXXXX")"
          mkdir -p "$scratch/libraries" "$scratch/Dropbox" "$scratch/state" "$scratch/data"
          out="$(unix "$RUNNER_TEMP")/cloud"
          mkdir -p "$out"
          cloud="$(native "$scratch/Dropbox")"
          # A backslash doubled: once for JSON, and again for sed.
          twice() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          image() { twice "$(native "$(cd ../.. && pwd)/resources/tutorial/$1")"; }
          sed -e "s|__LIBRARIES__|$(twice "$(native "$scratch/libraries")")|" \
              -e "s|__CLOUD__|$(twice "$(twice "$cloud")")|" \
              -e "s|__IMAGE1__|$(image mona-lisa.jpg)|" \
              -e "s|__IMAGE2__|$(image inbox-study.jpg)|" \
              -e "s|__IMAGE3__|$(image collection-a.jpg)|" \
              ci/cloud.txt > "$scratch/cloud.txt"
          PICTO_GPUI_SILENT=1 PICTO_GPUI_MENU=window \
          PICTO_DROPBOX_ROOT="$cloud" \
          PICTO_GPUI_TEST_LIBRARIES="$(native "$scratch/libraries")" \
          PICTO_GPUI_STATE="$(native "$scratch/state")" \
          PICTO_GPUI_APP_DATA="$(native "$scratch/data")" \
          PICTO_GPUI_SCRIPT="$(native "$scratch/cloud.txt")" \
          PICTO_GPUI_OUT="$(native "$out")" \
            cargo test --locked -- --ignored --exact offscreen::plays_a_script --nocapture 2>&1 | tee "$out/cloud.log"
          answers="$(grep -E '^(navigation\.get|cloud\.)' "$out/cloud.log")"
          before="$(grep '^navigation.get' "$out/cloud.log" | head -n 1)"
          after="$(grep '^navigation.get' "$out/cloud.log" | tail -n 1)"
          echo "$answers" | cut -c1-200
          # The folder made after the snapshot is there before the restore
          # and gone after it; the one made before it stays.
          [[ "$before" == *'String("After")'* ]]
          [[ "$after" == *'String("Before")'* ]]
          [[ "$after" != *'String("After")'* ]]
          grep -q '^cloud.restore.list -> Ok(Array \[Object' "$out/cloud.log"
          grep -q '^cloud.configuration.get -> Ok(Object {"provider": Null' "$out/cloud.log"
          test -n "$(ls "$scratch/libraries/Cloudy.library/cloud/emergency")"

      - name: Upload cloud check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-${{ matrix.platform }}
          path: ${{ runner.temp }}/cloud
          if-no-files-found: warn

      # The sign-in window runs on the system's web view: WebView2 needs its
      # runtime, which a Windows image may not have; the Evergreen
      # bootstrapper installs it from Microsoft when it is missing.
      - name: WebView2 Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          function Installed {
            foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id",
                               "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id",
                               "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id")) {
              if (Test-Path $key) {
                $version = (Get-ItemProperty $key).pv
                if ($version -and $version -ne '0.0.0.0') { return $version }
              }
            }
            return $null
          }
          $version = Installed
          if (-not $version) {
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
            $version = Installed
          }
          if (-not $version) { throw 'The WebView2 Runtime is not installed.' }
          "WebView2 Runtime $version"

      # The sign-in window opened for real in the app on the copy above, on
      # the system's web view (WebKitGTK in a GTK window on a virtual X
      # display on Linux, WebView2 on Windows), against a login the app
      # serves itself on the loopback (`src/logins/check.rs`): a page that
      # cannot load, Cancel, the window closed, and a sign-in whose cookie is
      # saved through `auth.credentials.set`, read back and removed. No site
      # is contacted, nothing runs or downloads, and logins stay in the
      # process.
      - name: Sign-in window
        shell: bash
        run: |
          native() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          unix() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -u "$1"; else printf '%s' "$1"; fi; }
          out="$(unix "$RUNNER_TEMP")/login-check"
          mkdir -p "$out/state" "$out/data"
          export PICTO_GPUI_HOLD_RUNS=1 PICTO_GPUI_HOLD_DOWNLOADS=1 PICTO_GPUI_SILENT=1
          export PICTO_GPUI_STATE="$(native "$out/state")" PICTO_GPUI_APP_DATA="$(native "$out/data")"
          export PICTO_GPUI_LOGIN_ORIGIN=http://127.0.0.1:47613
          export PICTO_GPUI_LOGIN_CHECK="$(native "$out")"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # A virtual display has no GPU buffers to share with WebKit's
            # renderer.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            run=(xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session --)
          else
            run=()
          fi
          status=0
          timeout 900 "${run[@]}" cargo run --locked -q -- "$PICTO_CI_COPY" > "$out/app.log" 2>&1 || status=$?
          echo "app ended with $status"
          grep -i "login check\|panic\|sign-in window" "$out/app.log" || true
          test -f "$out/login-check.log"
          grep -qx 'result: pass' "$out/login-check.log"

      # The network features in the app on the copy above, against fixtures
      # the app serves itself on the loopback (`src/net_check.rs`): the
      # services' icons fetched, kept and drawn or left as the globe; an
      # update found, its installer (a stand-in the check builds, which only
      # writes down how it was started) downloaded and verified against this
      # system's feed (`latest.yml` on Windows, `latest-linux.yml` on Linux),
      # a mismatching one refused and not kept and one changed after its
      # verification never started; Search by Image on every engine in the
      # hidden web view, each receiving exactly the file's bytes, name and
      # type; then Restart and Install, after which the app must have quit
      # and the stand-in run as electron-updater runs the installer: on
      # Windows with `--updated --force-run`, on Linux moved over the
      # AppImage `$APPIMAGE` names (a stand-in here) under its new name and
      # run with `APPIMAGE_SILENT_INSTALL=true`. A second run quits with the
      # update waiting instead, which installs it silently (`--updated /S`;
      # on Linux run until it exits, with `APPIMAGE_EXIT_AFTER_INSTALL`).
      # No real service is contacted and no real installer is started.
      - name: Network features
        shell: bash
        run: |
          native() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          unix() { if [[ "$RUNNER_OS" == Windows ]]; then cygpath -u "$1"; else printf '%s' "$1"; fi; }
          if [[ "$RUNNER_OS" == Linux ]]; then
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            run=(xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session --)
          else
            run=()
          fi
          check() {
            out="$1"
            mkdir -p "$out/state" "$out/data" "$out/app"
            if [[ "$RUNNER_OS" == Linux ]]; then
              printf 'the AppImage being replaced\n' > "$out/app/Picto-0.6.1-alpha.AppImage"
              chmod 755 "$out/app/Picto-0.6.1-alpha.AppImage"
              export APPIMAGE="$out/app/Picto-0.6.1-alpha.AppImage"
            fi
            export PICTO_GPUI_HOLD_RUNS=1 PICTO_GPUI_SILENT=1
            export PICTO_GPUI_STATE="$(native "$out/state")" PICTO_GPUI_APP_DATA="$(native "$out/data")"
            export PICTO_GPUI_NET_ORIGIN=http://127.0.0.1:47614
            export PICTO_GPUI_NET_CHECK="$(native "$out")"
            status=0
            timeout 900 "${run[@]}" cargo run --locked -q -- "$PICTO_CI_COPY" > "$out/app.log" 2>&1 || status=$?
            echo "app ended with $status"
            grep -i "net check\|panic\|search by image\|web view\|install" "$out/app.log" || true
            # Ended by itself, not by the timeout.
            test "$status" != 124
            test -f "$out/net-check.log"
            grep -qx 'result: pass' "$out/net-check.log"
            for _ in $(seq 60); do test -f "$out/installer-ran.txt" && break; sleep 1; done
            echo "the stand-in installer wrote:"
            cat "$out/installer-ran.txt"
            tr -d '\r' < "$out/installer-ran.txt" > "$out/ran.txt"
          }
          out="$(unix "$RUNNER_TEMP")/net-check"
          check "$out"
          if [[ "$RUNNER_OS" == Windows ]]; then
            grep -qi '^path=.*\\updates\\Picto-Setup-0\.7\.0-alpha\.exe$' "$out/ran.txt"
            test "$(grep '^arg=' "$out/ran.txt")" = "$(printf 'arg=--updated\narg=--force-run')"
          else
            test ! -e "$out/app/Picto-0.6.1-alpha.AppImage"
            test -x "$out/app/Picto-0.7.0-alpha.AppImage"
            grep -qx "path=$out/app/Picto-0.7.0-alpha.AppImage" "$out/ran.txt"
            test -z "$(grep '^arg=' "$out/ran.txt" || true)"
            grep -qx 'silent=true' "$out/ran.txt"
            grep -qx 'exit-after=' "$out/ran.txt"
          fi
          quit="$(unix "$RUNNER_TEMP")/net-check-quit"
          mkdir -p "$quit"
          touch "$quit/install-on-quit"
          check "$quit"
          if [[ "$RUNNER_OS" == Windows ]]; then
            grep -qi '^path=.*\\updates\\Picto-Setup-0\.7\.0-alpha\.exe$' "$quit/ran.txt"
            test "$(grep '^arg=' "$quit/ran.txt")" = "$(printf 'arg=--updated\narg=/S')"
          else
            test ! -e "$quit/app/Picto-0.6.1-alpha.AppImage"
            test -x "$quit/app/Picto-0.7.0-alpha.AppImage"
            grep -qx "path=$quit/app/Picto-0.7.0-alpha.AppImage" "$quit/ran.txt"
            grep -qx 'silent=true' "$quit/ran.txt"
            grep -qx 'exit-after=true' "$quit/ran.txt"
          fi

      - name: Upload network check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-check-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/net-check/*.log
            ${{ runner.temp }}/net-check/installer-ran.txt
            ${{ runner.temp }}/net-check-quit/*.log
            ${{ runner.temp }}/net-check-quit/installer-ran.txt
          if-no-files-found: warn

      - name: Upload sign-in window check
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: login-check-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/login-check/*.log
            ${{ runner.temp }}/login-check/*.png
          if-no-files-found: warn

[package]
name = "picto_sources"
version = "0.6.0-alpha"
edition = "2021"
license = "MIT"

[dependencies]
futures-util = "0.3"
mime_guess = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "stream"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3.8"

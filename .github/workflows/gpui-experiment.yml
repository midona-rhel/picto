name: GPUI experiment

# Builds and tests experiments/gpui on the platforms it is not developed on.
# macOS is built locally on every change; this proves the same source compiles
# and its tests pass on Windows and Linux.
on:
  push:
    branches:
      - "feature/163-**"
    paths:
      - "experiments/gpui/**"
      - "picto-library/**"
      - ".github/workflows/gpui-experiment.yml"
  workflow_dispatch:

concurrency:
  group: gpui-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build + test (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/gpui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: experiments/gpui -> target
          cache-on-failure: true

      # GPUI's Linux backends (Wayland, X11, Vulkan, fontconfig), the audio
      # output Ruffle links against, and what the application core needs
      # (D-Bus for the keyring, libclang for its bindings).
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            cmake \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            libudev-dev

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

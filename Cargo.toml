[workspace]
members = [
    "core",
    "picto-library",
    "native/picto-node",
]
resolver = "2"

[profile.release]
strip = "symbols"

# Optimize image-processing deps even in debug builds (PNG decode is 10-50x
# slower without optimizations, making phash computation painfully slow).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.img_hash]
opt-level = 3
[profile.dev.package.webp]
opt-level = 3

# The desktop debugger uses the native core directly. Leaving the application
# crates at opt-level 0 makes ordinary query row mapping and JSON serialization
# dominate IPC latency even though SQLite itself is fast.
[profile.dev.package.picto_core]
opt-level = 2
[profile.dev.package.picto_library]
opt-level = 2
[profile.dev.package.picto_node]
opt-level = 2

# The workspace of the crates below the user interface. The app has a
# workspace of its own (`experiments/gpui/Cargo.toml`), which uses `core` and
# `picto-library` as path dependencies and has its own profiles.
[workspace]
members = [
    "core",
    "picto-library",
    "picto-sources",
]
resolver = "2"

[profile.release]
strip = "symbols"

# The image crates are optimized in a debug build too. Without optimization
# a PNG is decoded 10 to 50 times more slowly, and computing the perceptual
# hash of an image then takes too long to work with.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.img_hash]
opt-level = 3
[profile.dev.package.webp]
opt-level = 3

# BoringSSL and the prebuilt ONNX Runtime must use the same MSVC runtime.
# An unoptimized BoringSSL dependency selects the debug CRT on Windows, while
# ONNX Runtime's distributed libraries use the release CRT.
[profile.dev.package.boring-sys2]
opt-level = 2

# The three crates of this workspace are optimized in a debug build. At
# `opt-level` 0, turning query rows into values and writing JSON takes longer
# than the SQLite query itself.
[profile.dev.package.picto_core]
opt-level = 2
[profile.dev.package.picto_library]
opt-level = 2
[profile.dev.package.picto_sources]
opt-level = 2

# Queries call these crates directly: bitmap membership, picking the item at
# a position, and reading SQLite rows. They are optimized in a debug build
# for the same reason as the image crates. The debug information of the
# workspace's own crates is kept.
[profile.dev.package.roaring]
opt-level = 3
[profile.dev.package.rusqlite]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

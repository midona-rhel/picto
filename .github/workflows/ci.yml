name: CI

# Verifies every pull request, whatever branch it is based on, and every
# push to `dev`. A release branch has its own workflow (`alpha-gate.yml`),
# which calls the same verify workflow and also builds the packages for the
# three systems.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml

  branch-policy:
    name: branch-policy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # The policy script is taken from the base branch, never from the pull
      # request, so that a pull request cannot change the policy it is
      # checked against. A base branch that is older than the policy has no
      # script. For such a branch the script is taken from the fixed commit
      # named below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ hashFiles('scripts/ci/check-branch-policy.mjs') == '' }}
        with:
          repository: midona-rhel/picto
          ref: 4ef23325093f6e0c55b9db925643f26251d20ed9
          path: .branch-policy-bootstrap
          persist-credentials: false
      - name: Check the branch policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -f scripts/ci/check-branch-policy.mjs; then
            node scripts/ci/check-branch-policy.mjs
          else
            node .branch-policy-bootstrap/scripts/ci/check-branch-policy.mjs
          fi

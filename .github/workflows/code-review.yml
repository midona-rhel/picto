name: Code review

# Every pull request gets an automated review against AGENTS.md's review
# guidelines; a human still approves and merges. `@claude` in a pull request
# comment asks a follow-up question about the same diff.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude
# setup-token`) or ANTHROPIC_API_KEY. Without it, and on fork pull requests,
# which never receive secrets, the job skips instead of failing.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    name: review
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Automated review skipped; add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable it."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: env.HAS_CREDENTIALS == 'true' && github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff against the "Review guidelines"
            section of AGENTS.md and the engineering rules in CONTRIBUTING.md.
            Read surrounding code before judging a change.

            Report only real problems: incorrect behavior, data loss or
            corruption risk, broken undo, stale projections or caches, missed
            invalidation, performance regressions on large libraries,
            platform-specific breakage (Windows, macOS, Linux), security
            issues, and duplicated ownership of a fact. Skip style nits the
            linters already enforce.

            Put each finding as an inline comment on the line it concerns,
            with the failure scenario. Then post one short summary comment
            with `gh pr comment`; if nothing is wrong, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Answer the mention
        if: env.HAS_CREDENTIALS == 'true' && github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

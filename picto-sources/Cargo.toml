[package]
name = "picto_sources"
version = "0.6.5-alpha"
edition = "2021"
license = "MIT"

[dependencies]
chrono = "0.4"
futures-util = "0.3"
md-5 = "0.10"
mime_guess = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "http2", "json", "rustls-tls", "stream", "system-proxy"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.8"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
wreq = { version = "0.15.3", features = ["cookies", "json"] }
wreq-util = "0.1.0"
xitter-txid = { version = "0.1", default-features = false }
zip = "2"

[dev-dependencies]
image = "0.25"
